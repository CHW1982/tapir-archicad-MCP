[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapir-archicad-mcp"
version = "0.4.0"
description = "Stable production MCP server for Archicad automation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "faiss-cpu>=1.9.0",
    "fastmcp>=0.4.1",
    "multiconn-archicad==0.6.0",
    "requests>=2.32.3",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.10.0",
]

[project.scripts]
archicad-server = "tapir_archicad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tapir_archicad_mcp"]

[tool.uv]
managed = true
